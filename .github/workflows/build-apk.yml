name: Build APK

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare optional release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/netpulse-release.keystore"
            echo "NETPULSE_KEYSTORE=$RUNNER_TEMP/netpulse-release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build signed APK
        env:
          NP_BUILD_TOOLS_VERSION: "35.0.0"
          NETPULSE_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NETPULSE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NETPULSE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash build.sh
          sha256sum netpulse.apk > netpulse.apk.sha256
          cat netpulse.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: netpulse-apk
          path: |
            netpulse.apk
            netpulse.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            netpulse.apk
            netpulse.apk.sha256
          generate_release_notes: true
